name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.COOLPLAYER_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          ls -la "$RUNNER_TEMP/keystore.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -PCOOLPLAYER_STORE_FILE="$RUNNER_TEMP/keystore.jks" \
            -PCOOLPLAYER_STORE_PASSWORD="$COOLPLAYER_STORE_PASSWORD" \
            -PCOOLPLAYER_KEY_ALIAS="$COOLPLAYER_KEY_ALIAS" \
            -PCOOLPLAYER_KEY_PASSWORD="$COOLPLAYER_KEY_PASSWORD"
        env:
          COOLPLAYER_STORE_PASSWORD: ${{ secrets.COOLPLAYER_STORE_PASSWORD }}
          COOLPLAYER_KEY_ALIAS: ${{ secrets.COOLPLAYER_KEY_ALIAS }}
          COOLPLAYER_KEY_PASSWORD: ${{ secrets.COOLPLAYER_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/CoolPlayer-$VERSION.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/CoolPlayer-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
